# ==============================================================
# Configuration Application ZAYNA Backend (Local XAMPP & Docker)
# ==============================================================
server.port=8080

# Configuration MySQL (Par defaut compatible XAMPP : root sans mot de passe)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/zaynadb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gestion des fichiers statiques (Upload et affichage des images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:uploads/


# ==============================================================
# Module User : Securite / JWT
# ==============================================================
# Le secret JWT est OBLIGATOIRE (variable d'environnement JWT_SECRET, 32 caracteres minimum)
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=zayna-backend
app.jwt.access-token-expiration-minutes=15
app.jwt.refresh-token-expiration-days=7

# CORS : plusieurs origines separees par des virgules. En production, remplacer * par les vraies origines.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:*}

# Administrateur initial (cree au demarrage uniquement s'il n'existe aucun ADMIN)
app.admin.email=${ADMIN_EMAIL:}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.first-name=${ADMIN_FIRST_NAME:Admin}
app.admin.last-name=${ADMIN_LAST_NAME:ZAYNA}


# ==============================================================
# Module User : mot de passe oublie, e-mail, photos de profil
# ==============================================================
app.password-reset.expiration-minutes=30
app.password-reset.link-base=${PASSWORD_RESET_LINK_BASE:zayna://reset-password}

# Si MAIL_DEV_LOG_LINKS=true et SMTP non configure, le lien de reinitialisation est ecrit dans les logs (DEV UNIQUEMENT)
app.mail.from=${MAIL_FROM:}
app.mail.dev-log-links=${MAIL_DEV_LOG_LINKS:false}

spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.storage.profile-images-dir=${PROFILE_IMAGES_DIR:uploads/users}
app.storage.profile-image-max-size-mb=5
