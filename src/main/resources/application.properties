# ==============================================================
# Configuration Application ZAYNA Backend (Local XAMPP & Docker)
# ==============================================================
server.port=8080

# Configuration MySQL (Par defaut compatible XAMPP : root sans mot de passe)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/zaynadb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gestion des fichiers statiques (Upload et affichage des images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:uploads/


# ==============================================================
# Module User : Securite / JWT
# ==============================================================
# Le secret JWT est OBLIGATOIRE (variable d'environnement JWT_SECRET, 32 caracteres minimum)
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=zayna-backend
app.jwt.access-token-expiration-minutes=15
app.jwt.refresh-token-expiration-days=7

# CORS : plusieurs origines separees par des virgules. En production, remplacer * par les vraies origines.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:*}

# Administrateur initial (cree au demarrage uniquement s'il n'existe aucun ADMIN)
app.admin.email=${ADMIN_EMAIL:}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.first-name=${ADMIN_FIRST_NAME:Admin}
app.admin.last-name=${ADMIN_LAST_NAME:ZAYNA}
